<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tv Show Finder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Tv Show Finder</h1>
      <p>Find Your Faviorte tv shows!</p>
    </header>
    <main>
      <form id="search-form">
        <input
          type="text"
          name=""
          id="search-input"
          placeholder="Enter Tv Show name"
          required
        />
        <button type="submit">Search</button>
      </form>
      <p id="message"></p>
      <section>
        <h2>Popular Shows</h2>
        <div class="grid" id="shows">
          
          
        </div>
      </section>
      <section>
        <h2 id="favorite">My Faviortes</h2>
        <div id="favorites" class="grid">
          
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
